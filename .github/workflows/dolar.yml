name: Dolar Bot

on:
  schedule:
    - cron: "00 13 * * 1-5" # Lun-Vie 13:00 UTC = 10:00 AR aprox (según DST)
  workflow_dispatch:
    inputs:
      force_send:
        description: "Modo prueba (envía a chat TEST)"
        required: false
        default: "false"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dolar-bot
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache bot state
        uses: actions/cache@v4
        with:
          path: .bot_state
          key: dolar-bot-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dolar-bot-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
        run: |
          python dolar_bot.py
